function useGlyph(role,value,x,y,opacity=1){return '<use href="#'+outlines[role][value][0]+'" x="'+x+'" y="'+y+'" opacity="'+opacity+'"/>'; }
const WIDTH=312, HEIGHT=177, HOLD_MS=350, MOVE_SLOP=8;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
// Deterministic demonstration history. Every period uses these same observations.
const days=[];
for(let d=Date.UTC(2021,10,5);d<=Date.UTC(2026,10,6);d+=86400000){const w=new Date(d).getUTCDay();if(w!==0&&w!==6)days.push(d);}
const minutes=[];for(let m=570;m<=720;m+=5)minutes.push(m);for(let m=780;m<=900;m+=5)minutes.push(m);
const history=[];
function hashNoise(i,seed){let x=Math.imul(i+seed*1013,374761393);x=Math.imul(x^(x>>>13),1274126177);return ((x^(x>>>16))>>>0)/4294967295*2-1;}
const OSCILLATION_FREQUENCY=.6;
function marketNoise(index){
 index=lastIndex+(index-lastIndex)*OSCILLATION_FREQUENCY;
 let value=0;
 const scales=[1,4,16,64,256,1024,4096,16384];
 for(let i=0;i<scales.length;i++){
  const t=index/scales[i],a=Math.floor(t),f=t-a;
  value+=(hashNoise(a,i+1)*(1-f)+hashNoise(a+1,i+1)*f)*.09*Math.pow(2,i);
 }
 return value;
}
const lastIndex=days.length*minutes.length-1,terminalNoise=marketNoise(lastIndex);
for(let day=0;day<days.length;day++){
 for(let k=0;k<minutes.length;k++){
  const index=day*minutes.length+k;
  const price=278.40+(index-lastIndex)*.0011+marketNoise(index)-terminalNoise;
  history.push({time:days[day]+(minutes[k]-480)*60000,price:Math.round(price*100)/100});
 }
}
history[history.length-1].price=278.40;
const spans={'1 d':55,'1 w':56*5-1,'1 m':56*22-1,'1 y':56*252-1,'All':history.length-1};
let period='1 m',end=history.length-1,view=null,ratio=1,animationId=0,inertiaId=0,gesture=null,selected=false,displaySamples=null,pointHiddenDuringTransition=false;
const pad=n=>String(n).padStart(2,'0');
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
function dateParts(time){const d=new Date(time+8*3600000),hour=d.getUTCHours();return {date:monthNames[d.getUTCMonth()]+' '+d.getUTCDate()+', '+d.getUTCFullYear(),time:(hour%12||12)+':'+pad(d.getUTCMinutes())+' '+(hour<12?'AM':'PM')};}
function glyphWidth(role,value){return Array.from(value).reduce((n,c)=>n+outlines[role][c][1],0);}
function glyphRun(role,value,x,y){return Array.from(value,c=>{const s=useGlyph(role,c,x,y);x+=outlines[role][c][1];return s;}).join('');}
function smallLabel(id,value,x,y,align='center'){
 const width=glyphWidth('small',value);$(id).innerHTML=glyphRun('small',value,x-(align==='center'?width/2:align==='right'?width:0),y);$(id).setAttribute('aria-label',value);
}
function paintQuote(price){
 const [whole,part]=price.toFixed(2).split('.'),cents='.'+part,wholeWidth=glyphWidth('large',whole);
 const x=(412-(30+wholeWidth+outlines.decimal[cents][1]))/2;
 $('price').innerHTML=useGlyph('peso','₱',x,78)+glyphRun('large',whole,x+30,40)+useGlyph('decimal',cents,x+30+wholeWidth,78,.45);
 $('price').setAttribute('aria-label','₱'+price.toFixed(2));
}
function observation(index){const i=clamp(Math.round(index),0,history.length-1);return {...history[i],index:i};}
// One stable curve per period: scrolling clips it rather than rebuilding its boundary slopes.
const periodCurves=new Map();
function curveTangents(points){
 const n=points.length,slopes=[],tangents=[];
 for(let i=0;i<n-1;i++)slopes.push((points[i+1].y-points[i].y)/(points[i+1].x-points[i].x));
 tangents[0]=slopes[0];tangents[n-1]=slopes[n-2];
 for(let i=1;i<n-1;i++){
  const a=slopes[i-1],b=slopes[i],h0=points[i].x-points[i-1].x,h1=points[i+1].x-points[i].x;
  const w0=2*h1+h0,w1=h1+2*h0;
  tangents[i]=a*b<=0?0:(w0+w1)/(w0/a+w1/b);
 }
 return tangents;
}
function periodCurve(name){
 if(periodCurves.has(name))return periodCurves.get(name);
 const step=Math.max(1,Math.floor(spans[name]/110))/OSCILLATION_FREQUENCY,indices=[0];
 const first=lastIndex-Math.floor(lastIndex/step)*step;
 for(let x=first;x<lastIndex;x+=step)indices.push(Math.round(x));indices.push(lastIndex);
 const nodes=[...new Set(indices)].map(index=>({x:index,y:history[index].price}));
 const result={nodes,tangents:curveTangents(nodes)};periodCurves.set(name,result);return result;
}
function lowerBound(nodes,index){let lo=0,hi=nodes.length;while(lo<hi){const mid=(lo+hi)>>1;if(nodes[mid].x<index)lo=mid+1;else hi=mid;}return lo;}
function curveValue(curve,index){
 const {nodes,tangents}=curve,right=lowerBound(nodes,index),i=clamp(right-1,0,nodes.length-2);
 if(nodes[right]&&Math.abs(nodes[right].x-index)<1e-8)return {index:nodes[right].x,price:nodes[right].y,slope:tangents[right],boundary:false};
 const a=nodes[i],b=nodes[i+1],h=b.x-a.x,t=clamp((index-a.x)/h,0,1),t2=t*t,t3=t2*t;
 const price=(2*t3-3*t2+1)*a.y+(t3-2*t2+t)*h*tangents[i]+(-2*t3+3*t2)*b.y+(t3-t2)*h*tangents[i+1];
 const slope=((6*t2-6*t)*a.y+(-6*t2+6*t)*b.y)/h+(3*t2-4*t+1)*tangents[i]+(3*t2-2*t)*tangents[i+1];
 return {index,price,slope,boundary:!(nodes[right]&&Math.abs(nodes[right].x-index)<1e-8)};
}
function calculateView(){
 const span=spans[period];end=clamp(end,span,lastIndex);
 const start=end-span,source=periodCurve(period),values=[curveValue(source,start)];
 let i=lowerBound(source.nodes,start);
 while(i<source.nodes.length&&source.nodes[i].x<end){
  const node=source.nodes[i];if(node.x>start)values.push({index:node.x,price:node.y,slope:source.tangents[i],boundary:false});i++;
 }
 values.push(curveValue(source,end));
 // Boundary values belong to the same continuous curve as the visible interior.
 const min=Math.min(...values.map(p=>p.price)),max=Math.max(...values.map(p=>p.price));
 const padding=Math.max(.001,(max-min)*.08),low=min-padding,high=max+padding,range=Math.max(.001,high-low);
 const points=values.map(p=>({...p,x:(p.index-start)/span*WIDTH,y:(high-p.price)/range*HEIGHT}));
 const tangents=values.map(p=>-p.slope*span/WIDTH*HEIGHT/range);
 const curve=makeCurve(points,tangents);
 return {start,end,span,points,selectablePoints:points.filter(p=>!p.boundary),low,high,path:curve.path,samples:curve.samples,first:Math.ceil(start),last:Math.floor(end),currentY:(high-history[lastIndex].price)/range*HEIGHT};
}
// Shape-preserving cubic interpolation: continuous tangents without overshoot.
function makeCurve(points,tangents=curveTangents(points)){
 const n=points.length;
 const path=points.map((p,i)=>{
  if(!i)return 'M '+p.x+' '+p.y;
  const a=points[i-1],h=(p.x-a.x)/3;
  return 'C '+(a.x+h)+' '+(a.y+tangents[i-1]*h)+' '+(p.x-h)+' '+(p.y-tangents[i]*h)+' '+p.x+' '+p.y;
 }).join(' ');
 let segment=0;
 const samples=Array.from({length:257},(_,i)=>{
  const x=i/256*WIDTH;
  while(segment<n-2&&x>points[segment+1].x)segment++;
  const a=points[segment],b=points[segment+1],h=b.x-a.x,t=clamp((x-a.x)/h,0,1),t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*a.y+(t3-2*t2+t)*h*tangents[segment]+(-2*t3+3*t2)*b.y+(t3-t2)*h*tangents[segment+1];
 });
 return {path,samples};
}
function sampledPath(samples){return samples.map((y,i)=>(i?'L':'M')+(i/256*WIDTH).toFixed(2)+' '+y.toFixed(3)).join(' ');}

function syncPointVisibility(){
 const panning=gesture?.mode==='pan'||inertiaId!==0;
 const atLatest=view&&view.end>=history.length-1-.001;
 $('point').setAttribute('visibility',!pointHiddenDuringTransition&&(selected||(!panning&&atLatest))?'visible':'hidden');
}
function updateEdges(){
 $('fadeLeft').setAttribute('stop-opacity',view.start>.001?'0':'1');
 $('fadeRight').setAttribute('stop-opacity',view.end<history.length-1-.001?'0':'1');
}
function draw(position,held){
 ratio=clamp(position,0,1);selected=held;
 const target=view.start+ratio*view.span;
 let point=view.selectablePoints[0];for(const p of view.selectablePoints){if(Math.abs(p.index-target)<Math.abs(point.index-target))point=p;}
 if(!held)point={index:history.length-1,x:WIDTH,y:view.currentY};
 const item=history[point.index];paintQuote(item.price);
 if(held){const stamp=dateParts(item.time);smallLabel('change',stamp.date+' • '+stamp.time,206,120);$('change').setAttribute('fill','white');}
 else {const baseline=history[history.length-1-spans[period]].price,diff=item.price-baseline,sign=diff<0?'−':'+';smallLabel('change',sign+' ₱'+Math.abs(diff).toFixed(2)+' ('+Math.abs(100*diff/baseline).toFixed(1)+'%)',206,120);$('change').setAttribute('fill',diff<0?'#ee3123':'#2f961b');}
 $('point').setAttribute('cx',point.x);$('point').setAttribute('cy',point.y);
 $('guide').setAttribute('d','M '+point.x+' -11 V 189');$('guide').setAttribute('visibility',held?'visible':'hidden');
 plot.setAttribute('aria-valuenow',item.price);plot.setAttribute('aria-valuetext','₱'+item.price.toFixed(2)+(held?', '+$('change').getAttribute('aria-label'):''));
 plot.dataset.selectedIndex=point.index;syncPointVisibility();
}
function updateView(){
 view=calculateView();updateEdges();$('history').setAttribute('d',view.path);displaySamples=view.samples.slice();
 smallLabel('high','₱'+view.high.toFixed(2),396,174,'right');smallLabel('low','₱'+view.low.toFixed(2),396,355,'right');
 plot.setAttribute('aria-valuemin',view.low);plot.setAttribute('aria-valuemax',view.high);
 draw(1,false);
}
function settleAnimation(){if(animationId){cancelAnimationFrame(animationId);animationId=0;pointHiddenDuringTransition=false;$('history').setAttribute('d',view.path);displaySamples=view.samples.slice();draw(ratio,selected);}}
function animatePath(from,to){
 const started=performance.now(),fromPoint=from[from.length-1],toPoint=to[to.length-1];
 displaySamples=from.slice();$('history').setAttribute('d',sampledPath(displaySamples));$('point').setAttribute('cy',fromPoint);
 function frame(now){const t=Math.min(1,(now-started)/220),ease=1-Math.pow(1-t,3);
  if(t===1){animationId=0;pointHiddenDuringTransition=false;$('history').setAttribute('d',view.path);displaySamples=to.slice();draw(1,false);return;}
  displaySamples=from.map((y,i)=>y+(to[i]-y)*ease);
  $('history').setAttribute('d',sampledPath(displaySamples));
  $('point').setAttribute('cx',WIDTH);$('point').setAttribute('cy',fromPoint+(toPoint-fromPoint)*ease);
  animationId=requestAnimationFrame(frame);
 }animationId=requestAnimationFrame(frame);
}
function updateScrollingView(){
 // Position, exact visible extrema, scale and line are committed together in this frame.
 updateView();
}
function stopInertia(){cancelAnimationFrame(inertiaId);inertiaId=0;if(view)syncPointVisibility();}
function cancelGesture(){if(!gesture)return;clearTimeout(gesture.timer);const id=gesture.id;gesture=null;if(plot.hasPointerCapture(id))plot.releasePointerCapture(id);plot.dataset.gesture='idle';}
function selectPeriod(value){
 if(value===period&&view)return;
 const previous=displaySamples?.slice();
 // A hidden historical/current-reference marker has no valid onscreen starting position.
 const currentPointWasVisible=!selected&&view?.end>=history.length-1-.001&&$('point').getAttribute('visibility')==='visible';
 pointHiddenDuringTransition=Boolean(previous&&!reducedMotion.matches&&!currentPointWasVisible);
 stopInertia();cancelGesture();cancelAnimationFrame(animationId);animationId=0;
 period=value;end=history.length-1;updateView();
 for(const item of $('periods').children)item.setAttribute('aria-pressed',String(item.dataset.period===value));
 if(previous&&!reducedMotion.matches)animatePath(previous,view.samples);
}
for(const [i,name]of ['1 d','1 w','1 m','1 y','All'].entries()){
 const item=document.createElementNS(ns,'g');item.setAttribute('class','period');item.setAttribute('role','button');item.setAttribute('tabindex','0');item.dataset.period=name;
 const x=[24,103.25,184.5,268.75,346][i],w=[43,45,48,41,42][i];item.setAttribute('aria-label',name);item.setAttribute('fill','white');
 item.innerHTML='<rect x="'+x+'" y="406" width="'+w+'" height="30" rx="15"/>'+useGlyph('fixed',name,x+12,412);
 item.addEventListener('pointerdown',e=>{if(e.isPrimary&&e.button===0){e.preventDefault();item.focus({preventScroll:true});selectPeriod(name);}});item.addEventListener('click',()=>selectPeriod(name));item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPeriod(name);}});$('periods').append(item);
}
function fingerRatio(clientX){const box=plot.getBoundingClientRect();return ((clientX-box.left)*320/box.width-4)/WIDTH;}
function explore(clientX){settleAnimation();draw(fingerRatio(clientX),true);}
plot.addEventListener('contextmenu',e=>e.preventDefault());
plot.addEventListener('pointerdown',e=>{
 if(gesture||e.button!==0||!e.isPrimary)return;
 e.preventDefault();stopInertia();settleAnimation();plot.setPointerCapture(e.pointerId);
 gesture={id:e.pointerId,mode:'pending',x:e.clientX,y:e.clientY,lastX:e.clientX,lastTime:performance.now(),startEnd:end,velocity:0,timer:0};plot.dataset.gesture='pending';
 const id=e.pointerId;
 gesture.timer=setTimeout(()=>{if(!gesture||gesture.id!==id||gesture.mode!=='pending')return;gesture.mode='select';plot.dataset.gesture='select';explore(gesture.lastX);},HOLD_MS);
});
window.addEventListener('pointermove',e=>{
 if(!gesture){if(e.pointerType==='mouse'&&e.target===plot){stopInertia();explore(e.clientX);}return;}
 if(e.pointerId!==gesture.id)return;
 const g=gesture,now=performance.now();
 if(g.mode==='pending'&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>MOVE_SLOP){clearTimeout(g.timer);g.mode='pan';plot.dataset.gesture='pan';}
 if(g.mode==='select')explore(e.clientX);
 if(g.mode==='pan'){
  const scale=document.querySelector('main').getBoundingClientRect().width/412;
  const proposed=g.startEnd-(e.clientX-g.x)/(WIDTH*scale)*spans[period];
  const next=clamp(proposed,spans[period],history.length-1);
  const velocity=-(e.clientX-g.lastX)/(WIDTH*scale)*spans[period]/Math.max(1,now-g.lastTime);
  g.velocity=next===proposed?velocity:0;end=next;updateScrollingView();
 }

});
function coast(velocity){
 if(reducedMotion.matches||Math.abs(velocity)<.002)return false;
 let last=performance.now();
 function step(now){const dt=Math.min(32,now-last);last=now;velocity*=Math.exp(-dt/140);const next=clamp(end+velocity*dt,spans[period],history.length-1);if(Math.abs(next-end)<.01){inertiaId=0;syncPointVisibility();return;}end=next;updateScrollingView();if(Math.abs(velocity)>.002)inertiaId=requestAnimationFrame(step);else {inertiaId=0;syncPointVisibility();}}
 inertiaId=requestAnimationFrame(step);syncPointVisibility();return true;
}
function finish(e){
 if(!gesture||e.pointerId!==gesture.id)return;
 const g=gesture;cancelGesture();
 if(e.type==='pointerup'&&g.mode==='pan'&&performance.now()-g.lastTime<80)coast(g.velocity);
 draw(1,false);
}
window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',finish);
plot.addEventListener('lostpointercapture',e=>{if(gesture&&e.pointerId===gesture.id){cancelGesture();draw(1,false);}});
plot.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!gesture){settleAnimation();draw(1,false);}});
window.addEventListener('blur',()=>{cancelGesture();stopInertia();settleAnimation();updateView();});
plot.addEventListener('keydown',e=>{
 if(!['ArrowLeft','ArrowRight','Escape'].includes(e.key))return;e.preventDefault();stopInertia();settleAnimation();
 if(e.key==='Escape'){cancelGesture();draw(1,false);return;}
 const direction=e.key==='ArrowRight'?1:-1;
 if(e.shiftKey){end+=direction*spans[period]*.15;updateScrollingView();}
 else {const i=view.selectablePoints.findIndex(p=>p.index===Number(plot.dataset.selectedIndex)),p=view.selectablePoints[clamp(i+direction,0,view.selectablePoints.length-1)];draw((p.index-view.start)/view.span,true);}
});
function syncBackground(){const box=document.querySelector('main').getBoundingClientRect(),scale=box.width/412;const stops=Array.from($('background').children,s=>s.getAttribute('stop-color')+' '+Number(s.getAttribute('offset'))*100+'%').join(',');document.body.style.backgroundImage='radial-gradient(circle '+531.4*scale+'px at '+(box.left+385.26*scale)+'px '+(box.top+window.scrollY+67.1*scale)+'px,'+stops+')';}
new ResizeObserver(syncBackground).observe(document.body);window.addEventListener('resize',syncBackground);syncBackground();selectPeriod(period);
